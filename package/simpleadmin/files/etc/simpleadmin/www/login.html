<!doctype html>
<html data-bs-theme="light" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>获取中... 登录</title>
<script src="js/locales.js?v=3.8"></script>
<script>
(function () {
  try {
    var theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', theme);
    document.documentElement.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
    document.documentElement.style.colorScheme = theme;
  } catch (e) {
    document.documentElement.setAttribute('data-bs-theme', 'light');
    document.documentElement.classList.add('theme-light');
    document.documentElement.style.colorScheme = 'light';
  }
})();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #eef1f7;
  --panel: #ffffff;
  --panel-glass: rgba(255, 255, 255, 0.86);
  --text: #18213a;
  --muted: #64708a;
  --faint: #97a1b8;
  --line: #d3dae8;
  --field: #ffffff;
  --primary: #4e6ef2;
  --primary-hover: #3d55d9;
  --danger: #e04141;
  --shadow: 0 1px 2px rgba(23,32,61,.05), 0 24px 64px -28px rgba(23,32,61,.30);
}
html[data-bs-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0f1a;
  --panel: #141a2a;
  --panel-glass: rgba(20, 26, 42, 0.88);
  --text: #e8ecf6;
  --muted: #97a2bb;
  --faint: #6b7690;
  --line: #303c5c;
  --field: #1a2135;
  --primary: #7c93ff;
  --primary-hover: #93a7ff;
  --danger: #ff7373;
  --shadow: 0 28px 80px -28px rgba(0,0,0,.7);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
  background-image:
    radial-gradient(900px 480px at 82% -8%, rgba(99, 102, 241, 0.16), transparent 62%),
    radial-gradient(720px 420px at -8% 4%, rgba(14, 165, 233, 0.12), transparent 58%),
    radial-gradient(560px 380px at 55% 112%, rgba(124, 92, 246, 0.10), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.login-actions {
  position: fixed;
  top: 16px;
  right: 16px;
  display: flex;
  justify-content: flex-end;
  z-index: 10;
}
.theme-toggle {
  width: auto;
  min-width: 92px;
  height: 36px;
  margin: 0;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--panel-glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .16s ease, color .16s ease;
}
.theme-toggle:hover { border-color: var(--primary); color: var(--primary); }
.login-shell {
  width: min(100%, 420px);
  background: var(--panel-glass);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 32px 30px;
  animation: login-in .4s cubic-bezier(.22,.7,.28,1);
}
@keyframes login-in {
  from { opacity: 0; transform: translateY(16px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .login-shell { animation: none; }
}
.login-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.login-mark {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg, #4e6ef2, #7c5cf6);
  color: #fff;
  font-weight: 700;
  letter-spacing: .02em;
  box-shadow: 0 8px 20px -8px rgba(78, 110, 242, .6);
}
.login-title { font-size: 22px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
.login-subtitle { margin-top: 5px; color: var(--muted); font-size: 13px; }
.form-row { display: grid; gap: 7px; margin-top: 15px; }
.language-select {
  width: 100%;
  min-height: 46px;
  padding: 9px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text);
  background: var(--field);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.login-title { overflow-wrap: anywhere; }
html[dir="rtl"] .login-actions { right: auto; left: 16px; }
#username, #password, .login-title, .login-mark { direction: ltr; }
label { font-size: 13px; font-weight: 600; color: var(--text); }
input {
  width: 100%;
  height: 46px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--field);
  color: var(--text);
  outline: none;
  padding: 0 15px;
  font: inherit;
  font-size: 14px;
  transition: border-color .16s ease, box-shadow .16s ease;
}
input::placeholder { color: var(--faint); }
input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--primary) 26%, transparent);
}
button {
  width: 100%;
  height: 46px;
  margin-top: 22px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #4e6ef2, #7c5cf6);
  color: #fff;
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: .02em;
  cursor: pointer;
  box-shadow: 0 10px 22px -10px rgba(78, 110, 242, .65);
  transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
button:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px -10px rgba(78, 110, 242, .7);
}
button:disabled { opacity: .6; cursor: wait; transform: none; }
.message { min-height: 22px; margin-top: 15px; color: var(--danger); font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <div class="login-actions"><button class="theme-toggle" id="themeToggle" type="button">暗夜模式</button></div>
  <main class="login-shell" aria-label="登录">
    <div class="login-brand">
      <div class="login-mark" data-simpleadmin-brand-mark="1">--</div>
      <div>
        <div class="login-title" data-simpleadmin-brand-title="1">获取中...</div>
        <div class="login-subtitle">请输入账号和密码</div>
      </div>
    </div>
    <form id="loginForm" autocomplete="on">
      <div class="form-row">
        <label for="loginLanguage">语言</label>
        <select id="loginLanguage" aria-label="语言" class="language-select" data-no-i18n dir="ltr"><option value="zh-CN">中文</option><option value="en">English</option><option value="ru">Русский</option><option value="ar">العربية</option></select>
      </div>
      <div class="form-row">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" placeholder="默认账号 admin" required>
      </div>
      <div class="form-row">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="默认密码 admin" required>
      </div>
      <button id="loginButton" type="submit">登录</button>
      <div id="loginMessage" class="message" role="alert"></div>
    </form>
  </main>
<script>
(function () {
  'use strict';
  const form = document.getElementById('loginForm');
  const button = document.getElementById('loginButton');
  const message = document.getElementById('loginMessage');
  const themeToggle = document.getElementById('themeToggle');
  const lang = window.SimpleAdmin.Lang;
  const languageSelect = document.getElementById('loginLanguage');
  languageSelect.value = lang.getCurrentLanguage();
  languageSelect.addEventListener('change', () => lang.setLanguage(languageSelect.value));
  window.addEventListener('simpleadmin:language-changed', () => {
    document.title = (document.querySelector('[data-simpleadmin-brand-title]').textContent || 'SimpleAdmin') + ' · ' + lang.t('登录');
  });
  function applyTheme(theme) {
    const normalized = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', normalized);
    document.documentElement.classList.toggle('theme-dark', normalized === 'dark');
    document.documentElement.classList.toggle('theme-light', normalized === 'light');
    document.documentElement.style.colorScheme = normalized;
    try { localStorage.setItem('theme', normalized); } catch (e) {}
    if (themeToggle) themeToggle.textContent = normalized === 'dark' ? '浅色模式' : '暗夜模式';
  }
  function normalizeModel(value) {
    var text = String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
    if (!text || text === '-' || text === '未知' || text === '获取中...') return '';
    return text;
  }
  function modelMark(value) {
    var model = normalizeModel(value);
    var chars = model.replace(/[^0-9A-Za-z\u4e00-\u9fa5]/g, '').split('');
    return chars.length ? chars.slice(0, 2).join('').toUpperCase() : '--';
  }
  function applyBrandModel(value) {
    var model = normalizeModel(value) || 'SimpleAdmin';
    document.querySelectorAll('[data-simpleadmin-brand-title]').forEach(function (element) {
      element.textContent = model;
    });
    document.querySelectorAll('[data-simpleadmin-brand-mark]').forEach(function (element) {
      element.textContent = modelMark(model);
    });
    document.title = model + ' · ' + lang.t('登录');
    try { localStorage.setItem('simpleadmin.moduleModelName', model); } catch (e) {}
  }
  function initBrandModel() {
    try {
      var cached = normalizeModel(localStorage.getItem('simpleadmin.moduleModelName'));
      if (cached) applyBrandModel(cached);
    } catch (e) {}
    fetch('/api/module_model?force=1', { cache: 'no-store', credentials: 'same-origin' })
      .then(function (response) {
        if (!response.ok) throw new Error('model status ' + response.status);
        return response.json();
      })
      .then(function (data) {
        if (data && normalizeModel(data.model)) applyBrandModel(data.model);
      })
      .catch(function () {
        if (!normalizeModel(document.querySelector('[data-simpleadmin-brand-title]').textContent)) {
          applyBrandModel('SimpleAdmin');
        }
      });
  }
  applyTheme((function () { try { return localStorage.getItem('theme'); } catch (e) { return null; } })() || document.documentElement.getAttribute('data-bs-theme') || 'light');
  initBrandModel();
  if (themeToggle) {
    themeToggle.addEventListener('click', function () {
      applyTheme(document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
    });
  }
  function nextURL() {
    const params = new URLSearchParams(window.location.search || '');
    const value = params.get('next') || '/';
    return value.startsWith('/') && !value.startsWith('//') ? value : '/';
  }
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    message.textContent = '';
    button.disabled = true;
    button.textContent = '登录中...';
    fetch('/api/login', {
      method: 'POST',
      cache: 'no-store',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
      body: new URLSearchParams(new FormData(form))
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok || !data.ok) throw new Error(data.error || 'login failed');
        window.location.replace(nextURL());
      });
    }).catch(function () {
      message.textContent = '用户名或密码错误';
    }).finally(function () {
      button.disabled = false;
      button.textContent = '登录';
    });
  });
})();
</script>
</body>
</html>
